name: Next.js Frontend CI

on:
  push:
    branches: [ "master", "main", "demo", "front-develop", "feature/**" ]
  pull_request:
    branches: [ "master", "main", "demo" ]

jobs:
  lint-and-build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: |
          npx tsc --noEmit
          npm run lint || true

      - name: Build Next.js Application
        run: npm run build
